{{- if .Values.rbac.create }}
# Node writes are done by the node-controller ServiceAccount (--use-service-account-credentials),
# so the CCM only mints its token. Kubernetes cannot restrict create by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: system:{{ include "xenorchestra-cloud-controller-manager.fullname" . }}
  namespace: kube-system
  labels:
    {{- include "xenorchestra-cloud-controller-manager.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  resourceNames:
  - node-controller
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  verbs:
  - create
  resourceNames:
  - node-controller
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - update
  resourceNames:
  - cloud-controller-manager-xenorchestra
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
{{- end }}

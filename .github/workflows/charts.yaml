name: Helm chart check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'

jobs:
  helm-lint:
    name: Helm chart check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Run helm template
        run: make helm-unit
